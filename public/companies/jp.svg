  <rect width="200" height="200" rx="44" fill="url(#jpBlueGrad)" filter="url(#shadowJp)"/>
  <circle cx="100" cy="92" r="54" fill="none" stroke="#bae6fd" stroke-width="3" stroke-dasharray="6 4" opacity="0.6"/>
  <!-- Bold modern JP Monogram -->
