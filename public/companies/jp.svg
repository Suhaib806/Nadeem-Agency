      <stop offset="0%" stop-color="#0596ff" />
      <stop offset="100%" stop-color="#0284c7" />
    </linearGradient>
    <filter id="shadowJp" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="4" stdDeviation="6" flood-color="#0369a1" flood-opacity="0.28"/>
